# build-pack.yml
#
# jQuery 1.11.1 is Node 0.10 / grunt 0.4 era, and its test suite runs on
# Travis (see .travis.yml: phantomjs against a local nginx/php-fpm QUnit
# server). That harness doesn't belong here, so this workflow is
# build-and-pack only -- it reproduces the published npm tarball, not the
# test run:
#   - the time-machine npm registry pins dependency resolution to the
#     release date, so transitive deps (e.g. uglify-js) resolve to the
#     era-correct versions that were actually used to cut this release;
#   - faketime pins the wall clock during the grunt build so the `@DATE`
#     stamp baked into dist/jquery.js and the uglify banner's
#     `grunt.template.today('yyyy')` year match the real 2014-05-01 release
#     date instead of the CI run date;
#   - dist/cdn is generated by hand, reproducing build/release.js's
#     makeReleaseCopies(), because that file is a jquery-release plugin hook
#     that only runs inside a real `jquery-release` release flow and cannot
#     be invoked standalone.
name: build-pack

on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '0.10.48'

      - name: Print node/npm versions
        run: |
          node --version
          npm --version

      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Configure npm for time-machine registry
        run: |
          npm config set registry "https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/"
          npm config set strict-ssl false

      - name: Install dependencies
        run: npm install

      # Builds dist/jquery.js, lints, then uglifies to dist/jquery.min.js +
      # dist/jquery.min.map, and runs compare_size (Gruntfile.js "default").
      # The faked clock makes the @DATE stamp and the uglify banner year
      # match the real 2014-05-01 release instead of today's date.
      - name: Build dist under faked clock (grunt default task)
        env:
          TZ: UTC
          FAKETIME_DONT_FAKE_MONOTONIC: '1'
        run: faketime '2014-05-01 17:42:30' ./node_modules/.bin/grunt

      # Reproduces build/release.js's makeReleaseCopies(), which only runs
      # inside a full jquery-release release flow and can't be invoked
      # standalone -- so it's inlined here against the dist/ this job just
      # built.
      - name: Generate dist/cdn (build/release.js logic)
        run: |
          node <<'EOF'
          var fs = require("fs"), version = require("./package.json").version, cdnFolder = "dist/cdn";
          var releaseFiles = {
            "jquery-VER.js": "dist/jquery.js", "jquery-VER.min.js": "dist/jquery.min.js", "jquery-VER.min.map": "dist/jquery.min.map",
            "jquery.js": "dist/jquery.js", "jquery.min.js": "dist/jquery.min.js", "jquery.min.map": "dist/jquery.min.map",
            "jquery-latest.js": "dist/jquery.js", "jquery-latest.min.js": "dist/jquery.min.js", "jquery-latest.min.map": "dist/jquery.min.map"
          };
          if (!fs.existsSync(cdnFolder)) { fs.mkdirSync(cdnFolder); }
          Object.keys(releaseFiles).forEach(function (key) {
            var builtFile = releaseFiles[key], unpathedFile = key.replace(/VER/g, version), releaseFile = cdnFolder + "/" + unpathedFile;
            var text = fs.readFileSync(builtFile, "utf8");
            if (/\.map$/.test(releaseFile)) {
              text = text.replace(/"file":"([^"]+)","sources":\["([^"]+)"\]/,
                "\"file\":\"" + unpathedFile.replace(/\.min\.map/, ".min.js") + "\",\"sources\":[\"" + unpathedFile.replace(/\.min\.map/, ".js") + "\"]");
            } else if (/\.min\.js$/.test(releaseFile)) {
              text = text.replace(/\/\/# sourceMappingURL=\S+/, "");
            }
            fs.writeFileSync(releaseFile, text);
            console.log("Created: " + releaseFile);
          });
          EOF

      - name: Pack npm tarball
        # .github/ (this workflow) did not exist upstream in 2014 and .npmignore
        # does not list it; drop it so it is not packed into the tarball.
        run: |
          rm -rf .github
          npm pack
          ls -l jquery-1.11.1.tgz
          tar tzf jquery-1.11.1.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: jquery-npm-package
          path: jquery-1.11.1.tgz
          if-no-files-found: error
